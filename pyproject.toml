[project]
name = "gridstatusio"
version = "0.15.1"
description = "Python Client for GridStatus.io API"
authors = [{ name = "Max Kanter", email = "kmax12@gmail.com" }]
requires-python = ">=3.10, <4"
readme = "README.md"
license.file = "LICENSE"
maintainers = [{ name = "Max Kanter", email = "kmax12@gmail.com" }]
keywords = [
    "energy",
    "independent system operator",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests ~=2.32",
    "numpy ~=1.26",
    "pandas ~=2.3",
    "tqdm ~=4.67",
    "termcolor ~=3.2",
    "tabulate ~=0.9",
    "urllib3 ~=2.5",
    "setuptools ~=80.9",
    "idna ~=3.11",
    "certifi ~=2024.12",
    "virtualenv ~=20.35",
    "ipykernel ~=7.1",
    "plotly ~=6.3",
]

[project.urls]
"Source Code" = "https://github.com/kmax12/gridstatusio/"
"Issue Tracker" = "https://github.com/kmax12/gridstatusio/issues"

[tool.uv]
dev-dependencies = [
    "pytest ~=9.0",
    "pytest-xdist ~=3.8",
    "pytest-rerunfailures ~=16.1",
    "pre-commit ~=4.5",
    "kaleido==0.2.1",
    "nbformat ~=5.10",
    "ruff ~=0.5",
    "pyright ~=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["gridstatusio/tests/*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
lint.ignore = []
lint.select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # flake8-quotes
    "Q",
    # isort
    "I001"
]
src = ["gridstatusio"]

[tool.ruff.lint.isort]
known-first-party = ["gridstatusio"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "F403", "F405", "E501", "I001"]
"Examples/*.ipynb" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# typeCheckingMode = "strict" # Off for now, since it goes from 10 to 500+ errors, likely due to imports
